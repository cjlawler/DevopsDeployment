<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Second Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <header class="border-bottom">
        <div class="container py-4">
            <h1 class="h2 mb-0">Second Page</h1>
        </div>
    </header>

    <main class="container py-5">
        <section aria-labelledby="sample-images-heading">
            <h2 id="sample-images-heading" class="h4 mb-4">Sample Images</h2>
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
                <div class="col">
                    <figure class="card h-100 mb-0">
                        <img class="card-img-top object-fit-cover" src="https://picsum.photos/seed/sample-one/800/600" alt="Sample photograph one" loading="lazy">
                        <figcaption class="card-body text-body-secondary">Sample photograph one</figcaption>
                    </figure>
                </div>
                <div class="col">
                    <figure class="card h-100 mb-0">
                        <img class="card-img-top object-fit-cover" src="https://picsum.photos/seed/sample-two/800/600" alt="Sample photograph two" loading="lazy">
                        <figcaption class="card-body text-body-secondary">Sample photograph two</figcaption>
                    </figure>
                </div>
                <div class="col">
                    <figure class="card h-100 mb-0">
                        <img class="card-img-top object-fit-cover" src="https://picsum.photos/seed/sample-three/800/600" alt="Sample photograph three" loading="lazy">
                        <figcaption class="card-body text-body-secondary">Sample photograph three</figcaption>
                    </figure>
                </div>
            </div>
        </section>

        <p class="mt-4 mb-0"><a href="index.html">Back to My Webpage</a></p>
    </main>
</body>
</html>
