<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Webpage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <header class="border-bottom">
        <div class="container py-4 d-flex justify-content-between align-items-center">
            <h1 class="h2 mb-0">My Webpage</h1>
            <a class="btn btn-outline-primary" href="second.html">Second page</a>
        </div>
    </header>

    <main class="container py-5">
        <div class="row g-4 align-items-start">
            <section class="col-12" aria-label="Images">
                <div class="row g-4">
                    <div class="col-12 col-md-4">
                        <figure class="mb-0">
                            <img class="img-fluid rounded shadow-sm" src="img/Image20261020143402.jpg" alt="Featured image">
                            <figcaption class="mt-2 text-body-secondary">Featured image</figcaption>
                        </figure>
                    </div>
                    <div class="col-12 col-md-4">
                        <figure class="mb-0">
                            <img class="img-fluid rounded shadow-sm" src="https://picsum.photos/seed/index-sample/800/600" alt="Additional sample photograph" loading="lazy">
                            <figcaption class="mt-2 text-body-secondary">Additional sample image</figcaption>
                        </figure>
                    </div>
                    <div class="col-12 col-md-4">
                        <figure class="mb-0">
                            <img class="img-fluid rounded shadow-sm" src="https://picsum.photos/seed/index-sample-three/800/600" alt="Third sample photograph" loading="lazy">
                            <figcaption class="mt-2 text-body-secondary">Third sample image</figcaption>
                        </figure>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
