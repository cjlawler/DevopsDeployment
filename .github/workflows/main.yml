name: Test and Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run HTMLHint
        run: npx --yes htmlhint "webfiles/**/*.html"

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -lf ~/.ssh/deploy_key

      - name: Test SSH network connectivity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "Testing TCP connectivity to SSH port 22..."

          if timeout 10 bash -c \
            'cat < /dev/null > /dev/tcp/$SSH_HOST/22'; then
            echo "TCP port 22 is reachable"
          else
            echo "ERROR: Cannot reach SSH port 22"
            exit 1
          fi

      - name: Create remote directory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -vvv \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'mkdir -p "$HOME/webfiles"'

      - name: Copy website using SCP
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -r \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            ./webfiles/. \
            "$SSH_USER@$SSH_HOST:webfiles/"
